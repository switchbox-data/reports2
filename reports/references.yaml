  - abstract: The Commission commenced this proceeding to examine programs for addressing energy affordability for low income utility customers, to ensure that these programs continue to be consistent with the Commission's statutory and policy objectives, and to streamline the regulatory process to conserve administrative resources.1 The low income programs offered by utilities today do not conform to a consistent set of goals or objectives; and as a result, they vary in scope, eligibility, and amount of benefits. The Commission directed Staff, in consultation with interested parties, to conduct an investigation of utility low income programs, identify best practices, and develop a set of recommendations for how to optimize the implementation of utility low income programs, to be issued for party comment. Staff, under the direction of the Commission's Consumer Advocate, submits this report in compliance with the Commission's directive.
