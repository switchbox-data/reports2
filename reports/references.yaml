  - abstract: Replacing fossil-fueled appliances and vehicles with electric alternatives can reduce greenhouse gas emissions and air pollution in many settings. However, residential electrification can raise electricity demand beyond the safe limits of electrical infrastructure, increasing the risk of blackouts or requiring grid reinforcement that can be slow and expensive. Here, we estimate the physical and economic impacts on distribution grids of electrifying all housing and personal vehicles in each county of the lower 48 United States. We find that space heating is the main driver of grid impacts, with the coldest regions seeing demand peaks up to five times higher than today's peaks. Accommodating electrification of all housing and personal vehicles could require up to 544 GW of distribution grid reinforcement nationally, at a cost of \\\$320 to \\\$720 billion, or \\\$2,600 to \\\$5,800 per household (95% confidence intervals). However, demand-side management can mitigate demand peaks, reducing grid reinforcement costs by up to 77%.
    accessed: 2025-01-23
