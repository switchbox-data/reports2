  - abstract: This study presents the potential for increased adoption of energy efficiency and renewable energy technologies in New York State. It focuses on the long-term potential using a twenty-year study period, 2013--2032. Energy efficiency and renewable energy potential is reported statewide as well as separately for four regional zones (Long Island, New York City, Hudson Valley, and Upstate). Energy efficiency potential is estimated for electricity, natural gas, and petroleum fuels in the building and industrial sectors. Renewable energy potential is estimated for biomass, hydro, solar, and wind, and is also estimated for the buildings sector and electric generation sector. Overall, the study finds that large amounts of energy efficiency and renewable energy potential exist through the study period.
