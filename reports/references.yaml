  - abstract: The heating and cooling efficiencies of residential heat pumps are often characterized by a single number for each mode. These values are determined at specific test conditions. For heating, this rating is referred to as the HSPF (Heating Seasonal Performance Factor), and for cooling (for both heat pumps and air conditioners) the rating is the SEER (Seasonal Energy Efficiency Ratio). These values are used by consumers to compare conditioning systems, by utility program managers and regulators to predict savings and establish incentives, and by designers to specify equipment.
