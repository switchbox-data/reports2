  - abstract: Geothermal technologies can all provide the stable, dispatchable, non-intermittent energy that our energy system needs, yet the challenge of differentiating among these technologies and clearly defining them for the public and decision-makers is impeding progress. Even within the scope of district-scale geothermal technologies, there are multiple naming systems which are not always clearly linked to the specific designs and outcomes. In order to scale the provision of the different types of technologies that tap geothermal energy, technically accurate, clear, and standardized terminology needs to be adopted. This study proposes a taxonomy for geothermal energy networks (GENs), within the context of definitional clarity for geothermal technologies, district energy systems, and thermal energy networks (TENs). We introduce a taxonomy rubric that connects nomenclature and design choices to expected system outcomes. The proposed taxonomy is the product of extensive interviews and stakeholder engagement, with members of the geothermal and ground source heat pump communities, as well as academic, industry, advocacy, workforce, customer, policy and environmental justice groups. Across these industry stakeholders, the link between technology components, system design, performance, and terminology is desired and seen as necessary to industry success. One state regulatory leader referred to TENs as the first new utility in a hundred years. As multiple states and countries create policy to enable geothermal and thermal energy networks at the utility-scale, this proposed taxonomy rubric is intended to provide a clear nomenclature upon which to build statutory language and regulatory frameworks.
