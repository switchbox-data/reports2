  - abstract: This Report describes NYSERDA's analysis of the costs, benefits, and adoption opportunities for small-scale residential heat pumps in New York State over the period to 2025. The Report concludes that, based on a conservative application of constraint assumptions, heat pumps could serve approximately half of the thermal energy load in the small residential sector, with potential to increase this estimate as barriers such as landlord-tenant constraints or availability of hydronic heat pump systems are overcome. Achievable adoption potential for small-scale residential heat pumps is assessed to be around 7.5 TBtu of incremental site energy savings from oil and resistance heating replacements by 2025.
