  - abstract: Urban building modeling tools are developing rapidly; these tools use emerging simulation workﬂows for speciﬁc urban environmental design tasks, such as assessing the impacts of energy efﬁciency technologies at a district scale. However, with the emergence of new environmental design tasks, addressing all possible use cases and tasks is challenging and cannot be covered by a single tool. Urban-scale analysis at this level of complexity often requires linking multiple emerging tools, rather than using a single tool, to adequately evaluate a variety of possible ﬁelds in urban environmental design. To achieve this, ﬂexible platforms are needed to support multiple input formats (e.g., geometric and non-geometric building properties), enabling the mapping of such inputs to underlying simulation engines.
