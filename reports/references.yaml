  - abstract: "This project studied the value of long duration energy storage (LDES) to support decarbonization at three geographic levels: a) meeting Senate Bill 100 (De León, Chapter 312, Statutes of 2018) and statewide electric sector decarbonization planning, (b) providing local capacity and criteria air pollutant reductions in a Los Angeles Basin case study, and (c) support microgrids for customer resilience. This study found that LDES could cost effectively support bulk grid decarbonization and environmental justice; however, the more stringent resilience requirements of a customer microgrid potentially make LDES-based microgrids less cost-effective."
