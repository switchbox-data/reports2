  - abstract: The Carbon Neutral Buildings Roadmap is intended to help chart the course New York must take to make all homes and buildings carbon neutral by 2050. Built upon several years of rigorous analysis, programmatic development, and stakeholder outreach and feedback, the Carbon Neutral Buildings Roadmap (the "Roadmap"), is the first report in a new series, NYSERDA's Future of Buildings. The Roadmap lays out a guiding framework and general solution set for the critical work that must be undertaken to modernize New York State's building stock while reducing their use of fossil fuels. The Roadmap provides a longterm vision of the built environment in 2050, including recommendations on key policies, potential focus areas for technology advancement and programmatic needs, while also highlighting the near-term actions that are technologically ready, economically viable, and are being adopted in the market today.
