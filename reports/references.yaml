  - abstract: Economics provides policymakers guidance when they must depart from efficient pricing (equal to societal marginal cost) to cover an electric utility profit shortfall. Options include raising volumetric retail prices, tiered pricing, fixed charges, minimum bills, and demand charges. There is no ideal policy, but balancing efficiency and equity suggests using a combination of fixed charges and increased volumetric prices. Economics does not support the use of demand charges or minimum bills.
