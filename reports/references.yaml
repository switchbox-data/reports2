  - abstract: Geothermal networks, defined as networked ground-source heat pump systems, are a clean energy alternative to fossil fuels for heating and cooling buildings, and a scalable solution with the potential to decarbonize entire neighborhoods. The individual components used in these networks are well developed technologies, such as pipes, pumps, and geothermal heat pumps. Nevertheless, there is a knowledge gap regarding how to optimize design parameters for performance and costs for the entire system, to account for region-specific conditions and localized heating and cooling needs for the buildings within the network. Additionally, there is a current lack of standardized methods for comparing these systems.
