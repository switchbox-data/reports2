  - abstract: "NYSERDA commissioned this study of the long-range potential for energy efficiency and renewable energy technologies to displace fossil-fueled electricity in New York. The study examined the potential available from existing and emerging efficiency technologies and practices to lower end-use electricity requirements in residential, commercial, and industrial buildings. The study also estimated renewable electricity generation potential from biomass, fuel cells, hydropower, landfill gas, municipal solid waste, solar, and wind. The study assessed New York's efficiency and renewable potential over three time horizons: five years (through 2007), 10 years (through 2012), and 20 years (through 2022)."
